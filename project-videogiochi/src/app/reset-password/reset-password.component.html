<div class="container-fluid p-0 m-0 h-100 d-flex flex-column gap-4">
    <div>
        <app-navbar></app-navbar>
    </div>

    <div class="container p-0 w-75 d-flex flex-row">
        <div>
            <a (click)="goMyProfile()" class="fs-4 text-black cursor-pointer">
               <img src="../../assets/left-arrow-black.png" alt="left-arrow-black">
               <!-- <span class="font-custom">Indietro</span> -->
           </a>
       </div>
       <div class="w-100 d-flex justify-content-center align-items-center fs-1">
           <span class="font-custom text-black">Cambia Password</span>
       </div>
    </div>

    <div class="bg-black container w-75 rounded d-flex flex-column align-items-center justify-content-center gap-4 p-4">
        <div class="fs-5 text-white d-flex flex-column w-100 d-flex align-items-center">
            <label for="password" class="font-custom w-75">Nuova Password</label>
            <input type="text" placeholder="Inserisci Password Nuova*" class="font-custom w-75">
        </div>
        <div class="fs-5 text-white d-flex flex-column align-items-center w-100">
            <label for="newPassword" class="font-custom w-75">Conferma Password</label>
            <input type="text" placeholder="Conferma Password*" class="font-custom w-75">
        </div>
        <div class="w-75 d-flex justify-content-center align-items-center">
            <button class="btn btn-success">
                <span class="font-custom">
                    Conferma
                </span>
            </button>
        </div>
    </div>

    <!-- Spinner di caricamento (mostrato quando isLoading è true) -->
    <div *ngIf="isLoading" class="spinner-overlay">
        <div class="spinner"></div>
    </div>
</div>
